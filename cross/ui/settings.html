<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>와이파이 잠금 설정</title>
  <link rel="stylesheet" href="settings.css">
  <script src="settings.js" defer></script>
</head>
<body>
<main>
  <section id="sec-general">
    <h2>일반</h2>
    <div class="group">
      <label class="row">
        <div class="text">
          <div class="label">자동 잠금 사용</div>
          <div class="desc">키보드·마우스 입력이 없으면 아래 시간 뒤에 화면을 잠급니다.</div>
        </div>
        <input type="checkbox" class="switch" id="enabled">
      </label>
      <label class="row">
        <div class="text">
          <div class="label">로그인할 때 자동으로 실행</div>
          <div class="desc error" id="autostart-error" hidden></div>
        </div>
        <input type="checkbox" class="switch" id="autostart">
      </label>
    </div>
  </section>

  <section id="sec-current">
    <h2>현재 네트워크</h2>
    <div class="group">
      <div class="row current">
        <div class="wifi-icon" id="wifi-icon" aria-hidden="true"></div>
        <div class="text">
          <div class="label strong" id="wifi-text">확인 중…</div>
          <div class="desc" id="router-text" hidden></div>
          <div class="desc" id="policy-text"></div>
          <div class="desc" id="state-text"></div>
        </div>
        <button id="add-current-inline" hidden>등록</button>
      </div>
      <div class="row notice" id="permission" hidden>
        <div class="text">
          <div class="label warn" id="perm-title"></div>
          <div class="desc" id="perm-expl"></div>
        </div>
        <button id="perm-button"></button>
      </div>
      <div class="row notice" id="syslock" hidden>
        <div class="text">
          <div class="label warn" id="syslock-title"></div>
          <div class="desc" id="syslock-expl"></div>
        </div>
        <button id="syslock-button" hidden></button>
      </div>
    </div>
  </section>

  <section id="sec-rules">
    <h2>네트워크별 잠금 시간</h2>
    <div class="group" id="rules"></div>
    <div class="buttons">
      <button id="add-current">＋ 현재 네트워크 추가</button>
      <button id="add-by-name">이름으로 추가…</button>
    </div>
    <div class="group add-form" id="add-form" hidden>
      <div class="row">
        <div class="text">
          <div class="label">와이파이 이름으로 추가</div>
          <div class="desc">대소문자까지 정확히 입력해 주세요.</div>
        </div>
      </div>
      <div class="row">
        <input type="text" id="new-ssid" placeholder="와이파이 이름" autocomplete="off" spellcheck="false">
        <select id="new-timeout"></select>
      </div>
      <div class="row end">
        <div class="desc error" id="add-error" hidden></div>
        <button id="add-cancel">취소</button>
        <button id="add-commit" class="primary">추가</button>
      </div>
    </div>
    <p class="footer">위에 있는 규칙부터 적용됩니다. 공유기 주소까지 기록된 규칙은 이름이 같아도 공유기가 다르면 적용하지 않습니다. 이름으로만 추가한 규칙은 같은 이름의 모든 와이파이에 적용됩니다.</p>
  </section>

  <section id="sec-defaults">
    <h2>기본 잠금 시간</h2>
    <div class="group">
      <label class="row">
        <div class="label">등록되지 않은 와이파이</div>
        <select id="unknown"></select>
      </label>
      <label class="row">
        <div class="label">와이파이 꺼짐 · 연결 안 됨</div>
        <select id="nowifi"></select>
      </label>
    </div>
    <p class="footer">등록되지 않은 곳에서는 짧게 두면 노트북을 두고 자리를 비웠을 때 더 안전합니다.</p>
  </section>

  <section id="sec-advanced">
    <h2>고급</h2>
    <div class="group">
      <label class="row">
        <div class="label">잠그기 전에 화면에 경고 표시</div>
        <input type="checkbox" class="switch" id="warn">
      </label>
      <label class="row">
        <div class="text">
          <div class="label">경고 표시 시간</div>
          <div class="desc">잠금 시간이 짧으면 경고는 잠금 시간의 절반까지만 표시됩니다. 경고 중에 마우스나 키보드를 움직이면 취소됩니다.</div>
        </div>
        <select id="warning"></select>
      </label>
      <label class="row">
        <div class="text">
          <div class="label">동영상 재생 중에는 잠그지 않기</div>
          <div class="desc">앱이 화면을 켜 두도록 요청한 동안(동영상, 발표, 화상 회의 등)은 잠금을 미룹니다.</div>
          <div class="desc" id="holders-note" hidden></div>
        </div>
        <input type="checkbox" class="switch" id="respect">
      </label>
      <label class="row" id="countdown-row">
        <div class="text">
          <div class="label">메뉴 막대에 남은 시간 표시</div>
          <div class="desc">분 단위는 남은 시간이 1분에 한 번만 바뀌고 마지막 1분만 초 단위로 세어, 매 초 바뀌는 초 단위보다 컴퓨터 자원을 덜 씁니다.</div>
        </div>
        <select id="countdown"></select>
      </label>
    </div>
  </section>

  <p class="about" id="about"></p>
</main>
</body>
</html>
