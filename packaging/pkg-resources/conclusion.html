<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<style>body{font-family:-apple-system,"Apple SD Gothic Neo",sans-serif;font-size:13px;line-height:1.55} h2{font-size:16px;margin:0 0 8px} li{margin:3px 0}</style>
</head><body>
<h2>설치가 끝났습니다</h2>
<ol>
<li>화면 오른쪽 위 메뉴 막대에 자물쇠가 달린 화면 아이콘이 나타납니다.</li>
<li>와이파이 이름으로 네트워크를 구분하려면 위치 권한 요청에서 <b>허용</b>을 눌러 주세요. (위치 정보는 저장하거나 밖으로 보내지 않습니다)</li>
<li>설정 창에서 집·사무실 네트워크를 등록하고 잠금 시간을 정하세요.</li>
<li>컴퓨터를 켤 때 자동으로 실행하려면 설정에서 <b>로그인할 때 자동으로 실행</b>을 켜세요.</li>
</ol>
</body></html>
