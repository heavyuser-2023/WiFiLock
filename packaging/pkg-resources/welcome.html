<h2>와이파이 잠금</h2>
<p>와이파이 연결 상태에 따라 자동 화면 잠금 시간을 바꿔 주는 메뉴 막대 앱입니다.</p>
<ul>
<li>집·사무실처럼 등록한 네트워크에서는 잠금 시간을 길게</li>
<li>등록되지 않은 와이파이나 연결이 없을 때는 짧게</li>
<li>화면 오른쪽 위 메뉴 막대의 자물쇠 화면 아이콘에서 상태 확인, 지금 잠그기, 일시 중지, 설정, 종료</li>
</ul>
<p>앱은 <b>응용 프로그램</b> 폴더에 설치되며, 설치가 끝나면 바로 실행됩니다.</p>
