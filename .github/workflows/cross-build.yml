name: 러스트·타우리판 빌드 (맥·윈도우·리눅스)

on:
  push:
    branches:
      - rust-tauri
      # main 에 올릴 때도 세 운영체제(맥·윈도우·리눅스) 빌드·검증을 돌리려면
      # 바로 아래 줄 맨 앞의 "#" 와 그 뒤 빈칸 하나를 지워 "      - main" 으로 만드세요.
      # (켜면 cross/ 폴더나 이 파일이 바뀐 커밋을 main 에 올릴 때마다 약 15분 동안 빌드 서버 세 대가 돕니다)
      # - main
    paths:
      - "cross/**"
      - ".signpath/**"
      - ".github/workflows/cross-build.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: cross-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            label: 맥 (애플 실리콘·인텔 범용)
            key: macos
            args: --target universal-apple-darwin --bundles app,dmg
            bin: target/universal-apple-darwin/release/bundle/macos/WiFiLock.app/Contents/MacOS/wifilock
          - os: windows-latest
            label: 윈도우 (x64)
            key: windows
            args: --bundles nsis,msi
            bin: target/release/wifilock.exe
          - os: ubuntu-22.04
            label: 리눅스 (x64)
            key: linux
            args: --bundles deb,rpm,appimage
            bin: target/release/wifilock
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        working-directory: cross
    env:
      CI: "true"
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 리눅스 빌드 도구 설치
        if: matrix.key == 'linux'
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            libxdo-dev libssl-dev patchelf rpm xvfb xauth dbus-x11 at-spi2-core fonts-noto-cjk

      - name: 러스트 준비 (rust-toolchain.toml 의 1.99.1)
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustc --version

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: cross

      - name: 단위 테스트
        run: cargo test --workspace

      - name: 정적 검사
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: 빌드 도구 설치
        run: npm ci --no-audit --no-fund

      - name: 설치 파일 빌드 (맥·리눅스)
        if: matrix.key != 'windows'
        run: npx tauri build ${{ matrix.args }}

      - name: 실행 파일 빌드 (윈도우)
        if: matrix.key == 'windows'
        run: npx tauri build --no-bundle

      - name: 자가 진단 (맥)
        if: matrix.key == 'macos'
        run: perl -e 'alarm 300; exec @ARGV' "${{ matrix.bin }}" --self-test "$PWD/selftest"

      - name: 자가 진단 (리눅스, 가상 화면)
        if: matrix.key == 'linux'
        run: dbus-run-session -- xvfb-run -a -s "-screen 0 1920x1080x24" timeout 300 "${{ matrix.bin }}" --self-test "$PWD/selftest"

      - name: 자가 진단 (윈도우)
        if: matrix.key == 'windows'
        shell: pwsh
        run: |
          $dir = Join-Path $PWD "selftest"
          $p = Start-Process -FilePath "${{ matrix.bin }}" -ArgumentList @("--self-test", "`"$dir`"") -PassThru
          if (-not $p.WaitForExit(300000)) { $p.Kill(); Write-Host "시간 초과"; exit 1 }
          exit $p.ExitCode

      - name: 자가 진단 결과
        if: always()
        shell: bash
        run: cat selftest/summary.txt || echo "결과 파일 없음"

      - name: 미서명 윈도우 실행 파일 업로드 (SignPath 1차 서명용)
        if: matrix.key == 'windows' && vars.SIGNPATH_ORGANIZATION_ID != ''
        id: upload-unsigned-binary
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-windows-binary
          path: cross/target/release/wifilock.exe
          if-no-files-found: error

      - name: SignPath 코드 서명 요청 (윈도우 실행 파일)
        if: matrix.key == 'windows' && vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'wifilock' }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG || 'release-signing' }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_BINARY_CONFIG_SLUG || 'binary' }}
          github-artifact-id: ${{ steps.upload-unsigned-binary.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: cross/target/signed-binary

      - name: 서명된 윈도우 실행 파일 반영
        if: matrix.key == 'windows' && vars.SIGNPATH_ORGANIZATION_ID != ''
        shell: pwsh
        run: |
          $signed = Get-ChildItem -Path "target/signed-binary" -Filter "wifilock.exe" -Recurse -File | Select-Object -First 1
          if (-not $signed) { Write-Error "서명된 wifilock.exe 를 찾지 못했습니다"; exit 1 }
          Copy-Item -Force $signed.FullName "target/release/wifilock.exe"

      - name: 설치 파일 묶기 (윈도우)
        if: matrix.key == 'windows'
        run: npx tauri bundle --bundles nsis,msi --no-binary-patching

      - name: 미서명 윈도우 설치 파일 정리 (SignPath 2차 서명용)
        if: matrix.key == 'windows' && vars.SIGNPATH_ORGANIZATION_ID != ''
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "target/unsigned-installers" | Out-Null
          Get-ChildItem -Path "target/release/bundle" -Include "*-setup.exe","*.msi" -Recurse -File | ForEach-Object {
            Copy-Item -Force $_.FullName "target/unsigned-installers/$($_.Name)"
          }

      - name: 미서명 윈도우 설치 파일 업로드 (SignPath 2차 서명용)
        if: matrix.key == 'windows' && vars.SIGNPATH_ORGANIZATION_ID != ''
        id: upload-unsigned-installers
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-windows-installers
          path: cross/target/unsigned-installers/*
          if-no-files-found: error

      - name: SignPath 코드 서명 요청 (윈도우 설치 파일)
        if: matrix.key == 'windows' && vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'wifilock' }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG || 'release-signing' }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_INSTALLERS_CONFIG_SLUG || 'installers' }}
          github-artifact-id: ${{ steps.upload-unsigned-installers.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: cross/target/signed-installers

      - name: 서명된 윈도우 설치 파일 반영 및 서명 검증
        if: matrix.key == 'windows' && vars.SIGNPATH_ORGANIZATION_ID != ''
        shell: pwsh
        run: |
          Get-ChildItem -Path "target/signed-installers" -Filter "*-setup.exe" -Recurse -File | ForEach-Object {
            Copy-Item -Force $_.FullName "target/release/bundle/nsis/$($_.Name)"
          }
          Get-ChildItem -Path "target/signed-installers" -Filter "*.msi" -Recurse -File | ForEach-Object {
            Copy-Item -Force $_.FullName "target/release/bundle/msi/$($_.Name)"
          }
          $files = @(Get-Item "target/release/wifilock.exe") + @(Get-ChildItem -Path "target/release/bundle" -Include "*-setup.exe","*.msi" -Recurse -File)
          foreach ($f in $files) {
            $sig = Get-AuthenticodeSignature $f.FullName
            Write-Host "$($f.Name): $($sig.Status) ($($sig.SignerCertificate.Subject))"
            if ($sig.Status -ne 'Valid') {
              Write-Error "서명이 유효하지 않습니다: $($f.FullName)"
              exit 1
            }
          }

      - name: 설치 파일 확인값 (SHA-256)
        if: always()
        shell: bash
        run: |
          mkdir -p ../out
          find target -path '*/release/bundle/*' -type f \( -name '*.dmg' -o -name '*.exe' -o -name '*.msi' -o -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' \) -exec cp {} ../out/ \;
          cd ../out && (sha256sum * 2>/dev/null || shasum -a 256 *) | tee SHA256SUMS-${{ matrix.key }}.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wifilock-${{ matrix.key }}
          path: |
            out/
            cross/selftest/
          if-no-files-found: warn
